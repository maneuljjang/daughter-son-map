# 올릴 때마다 루트 규칙 테스트와 빌드가 되는지 확인합니다. (배포는 Vercel이 자동으로 해요)
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
